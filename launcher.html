<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코레일 좌석 감시 설정</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17213a;
      --muted: #65708a;
      --line: #dce2ec;
      --panel: rgba(255, 255, 255, .92);
      --blue: #1554d1;
      --blue-dark: #0d3ca0;
      --blue-soft: #edf3ff;
      --danger: #c13434;
      --shadow: 0 18px 55px rgba(31, 47, 85, .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #dce9ff 0, transparent 35%),
        radial-gradient(circle at 100% 45%, #e9efff 0, transparent 36%),
        #f5f7fb;
      font-family: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif;
    }
    main { width: min(980px, calc(100% - 32px)); margin: 42px auto 64px; }
    header { margin-bottom: 22px; }
    .eyebrow { color: var(--blue); font-size: 13px; font-weight: 800; letter-spacing: .1em; }
    h1 { margin: 7px 0 8px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.04em; }
    .lead { margin: 0; color: var(--muted); line-height: 1.65; }
    .card {
      padding: 28px;
      border: 1px solid rgba(211, 219, 233, .9);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    section + section { margin-top: 28px; padding-top: 26px; border-top: 1px solid var(--line); }
    h2 { margin: 0 0 16px; font-size: 17px; letter-spacing: -.02em; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: 1 / -1; }
    label.field { display: flex; flex-direction: column; gap: 8px; color: #3a455f; font-size: 13px; font-weight: 700; }
    input, select {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #cfd7e5;
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21, 84, 209, .12); }
    .hint { color: var(--muted); font-size: 12px; font-weight: 500; line-height: 1.45; }
    .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .mode { position: relative; }
    .mode input { position: absolute; opacity: 0; pointer-events: none; }
    .mode-box {
      display: block;
      min-height: 112px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: .15s ease;
    }
    .mode-box strong { display: block; margin-bottom: 7px; font-size: 15px; }
    .mode-box small { color: var(--muted); line-height: 1.5; }
    .mode input:checked + .mode-box { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 2px rgba(21, 84, 209, .12); }
    .mode.reserve input:checked + .mode-box { border-color: var(--danger); background: #fff2f2; box-shadow: 0 0 0 2px rgba(193, 52, 52, .1); }
    .toggles { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px; }
    .toggle { display: inline-flex; align-items: center; gap: 9px; color: #3a455f; font-size: 14px; font-weight: 650; cursor: pointer; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--blue); }
    .command-wrap { margin-top: 26px; }
    .command-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .command-title span { color: var(--muted); font-size: 12px; }
    pre {
      min-height: 74px;
      margin: 0;
      padding: 15px 17px;
      overflow: auto;
      border-radius: 13px;
      background: #111827;
      color: #d9e6ff;
      font: 13px/1.55 Consolas, "SFMono-Regular", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .actions { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 18px; }
    #status { flex: 1; color: var(--muted); font-size: 13px; line-height: 1.5; }
    #status.error { color: var(--danger); font-weight: 700; }
    #status.success { color: #167143; font-weight: 700; }
    button {
      min-width: 160px;
      height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 24px rgba(21, 84, 209, .22);
    }
    button:hover { background: var(--blue-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    button.danger { background: var(--danger); box-shadow: 0 9px 24px rgba(193, 52, 52, .2); }
    .copy { min-width: auto; height: auto; padding: 0; border: 0; background: none; color: var(--blue); box-shadow: none; font-size: 12px; }
    .copy:hover { background: none; text-decoration: underline; }
    @media (max-width: 720px) {
      main { width: min(100% - 20px, 980px); margin-top: 24px; }
      .card { padding: 20px; border-radius: 17px; }
      .span-3, .span-4, .span-6, .span-8 { grid-column: span 6; }
      .modes { grid-template-columns: 1fr; }
      .mode-box { min-height: 0; }
    }
    @media (max-width: 440px) {
      .span-3, .span-4, .span-6, .span-8 { grid-column: 1 / -1; }
      .actions { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">KORAIL SEAT WATCHER</div>
      <h1>감시 조건 설정</h1>
      <p class="lead">자주 잊는 옵션은 화면에서 고르고, 실행은 검증된 기존 명령줄 프로그램에 맡깁니다.</p>
    </header>

    <form class="card" id="launcher-form">
      <section>
        <h2>여정</h2>
        <div class="grid">
          <label class="field span-4">승차일
            <input id="date" name="date" type="date" required>
          </label>
          <label class="field span-4">출발역
            <select name="from" required>
              <option value="광명" selected>광명</option>
              <option value="서대전">서대전</option>
            </select>
          </label>
          <label class="field span-4">도착역
            <select name="to" required>
              <option value="광명">광명</option>
              <option value="서대전" selected>서대전</option>
            </select>
          </label>
          <label class="field span-3">출발 시각부터
            <input name="time" type="text" value="00:00" placeholder="HH:MM" inputmode="numeric"
              pattern="(?:[01][0-9]|2[0-3]):[0-5][0-9]" maxlength="5" title="24시간 형식으로 입력하세요. 예: 18:30" required>
            <span class="hint">24시간 형식 · 1830 입력 시 18:30으로 자동 교정</span>
          </label>
          <label class="field span-3">출발 시각까지
            <input name="timeTo" type="text" placeholder="HH:MM" inputmode="numeric"
              pattern="(?:[01][0-9]|2[0-3]):[0-5][0-9]" maxlength="5" title="24시간 형식으로 입력하세요. 예: 22:00">
            <span class="hint">선택 입력 · 2200 입력 시 22:00으로 자동 교정</span>
          </label>
          <label class="field span-3">특정 열차번호
            <input name="trains" type="text" inputmode="numeric" placeholder="예: 587,589">
            <span class="hint">비워두면 시간대 내 전체 열차</span>
          </label>
          <label class="field span-3">좌석 종류
            <select name="seatClass">
              <option value="gen">일반실</option>
              <option value="any">일반실 + 특실</option>
              <option value="spe">특실만</option>
              <option value="standing">입석·자유석</option>
            </select>
          </label>
        </div>
      </section>

      <section>
        <h2>승객</h2>
        <div class="grid">
          <label class="field span-3">어른
            <input name="adults" type="number" value="1" min="0" max="9" required>
          </label>
          <label class="field span-3">어린이
            <input name="children" type="number" value="0" min="0" max="9" required>
          </label>
          <label class="field span-3">유아
            <input name="infants" type="number" value="0" min="0" max="9" required>
          </label>
          <label class="field span-3">경로
            <input name="seniors" type="number" value="0" min="0" max="9" required>
          </label>
        </div>
      </section>

      <section>
        <h2>실행 방식</h2>
        <div class="modes">
          <label class="mode">
            <input type="radio" name="mode" value="notify" checked>
            <span class="mode-box"><strong>알림만 받기</strong><small>좌석이 생기면 텔레그램으로 알려주고 계속 감시합니다.</small></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="dry-run">
            <span class="mode-box"><strong>좌석 선택 테스트</strong><small>선택할 좌석만 보여주고 실제 예약은 하지 않습니다.</small></span>
          </label>
          <label class="mode reserve">
            <input type="radio" name="mode" value="reserve">
            <span class="mode-box"><strong>좌석 선택 후 예약</strong><small>공석 발견 시 실제 예약하고 첫 성공 후 종료합니다.</small></span>
          </label>
        </div>
        <div class="grid" style="margin-top: 18px">
          <label class="field span-4">조회 주기(초)
            <input name="interval" type="number" value="60" min="15" max="86400" required>
            <span class="hint">30초 이상을 권장합니다.</span>
          </label>
        </div>
        <div class="toggles">
          <label class="toggle"><input name="telegram" type="checkbox" checked> 텔레그램 사용</label>
          <label class="toggle"><input name="once" type="checkbox"> 한 번만 조회하고 종료</label>
        </div>
      </section>

      <div class="command-wrap">
        <div class="command-title">
          <h2 style="margin:0">실행될 명령어</h2>
          <button class="copy" id="copy-command" type="button">복사</button>
        </div>
        <pre id="command-preview" aria-live="polite"></pre>
      </div>
      <div class="actions">
        <div id="status" role="status">입력 후 시작을 누르면 이 창을 연 터미널에서 실행됩니다.</div>
        <button id="run-button" type="submit">감시 시작</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.querySelector('#launcher-form');
    const preview = document.querySelector('#command-preview');
    const status = document.querySelector('#status');
    const runButton = document.querySelector('#run-button');
    const numberFields = ['adults', 'children', 'infants', 'seniors', 'interval'];
    const timeFields = [form.elements.time, form.elements.timeTo];
    let watcherStarted = false;

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.querySelector('#date').value = [
      tomorrow.getFullYear(),
      String(tomorrow.getMonth() + 1).padStart(2, '0'),
      String(tomorrow.getDate()).padStart(2, '0'),
    ].join('-');

    const values = () => {
      const data = Object.fromEntries(new FormData(form));
      for (const field of numberFields) data[field] = Number(data[field]);
      data.telegram = form.elements.telegram.checked;
      data.once = form.elements.once.checked;
      return data;
    };

    const normalizeTime = input => {
      const compact = input.value.trim();
      if (/^\d{4}$/.test(compact)) input.value = `${compact.slice(0, 2)}:${compact.slice(2)}`;
    };

    for (const input of timeFields) {
      input.addEventListener('input', () => {
        if (/^\d{4}$/.test(input.value.trim())) normalizeTime(input);
      });
      input.addEventListener('blur', () => normalizeTime(input));
    }

    const quote = value => /^[\p{L}\p{N}._,:/-]+$/u.test(String(value)) ? String(value) : `"${String(value).replaceAll('"', '\\"')}"`;
    const previewArgs = data => {
      const args = [
        '--date', data.date || 'YYYY-MM-DD', '--time', data.time || '00:00',
        '--from', data.from || '출발역', '--to', data.to || '도착역',
        '--adults', data.adults, '--children', data.children, '--infants', data.infants,
        '--seniors', data.seniors, '--seat-class', data.seatClass, '--interval', data.interval,
      ];
      if (data.timeTo) args.push('--time-to', data.timeTo);
      if (data.trains?.trim()) args.push('--trains', data.trains.replace(/\s+/g, ''));
      if (data.mode === 'dry-run') args.push('--dry-run-reserve');
      if (data.mode === 'reserve') args.push('--reserve');
      if (data.once) args.push('--once');
      if (!data.telegram) args.push('--no-telegram');
      return `node watch.js ${args.map(quote).join(' ')}`;
    };

    const update = () => {
      const data = values();
      preview.textContent = previewArgs(data);
      const reserve = data.mode === 'reserve';
      runButton.textContent = reserve ? '예약 감시 시작' : data.mode === 'dry-run' ? '선택 테스트 시작' : '감시 시작';
      runButton.classList.toggle('danger', reserve);
    };
    form.addEventListener('input', update);
    form.addEventListener('change', update);
    update();

    document.querySelector('#copy-command').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(preview.textContent);
        status.className = 'success';
        status.textContent = '명령어를 클립보드에 복사했습니다.';
      } catch {
        status.className = 'error';
        status.textContent = '복사하지 못했습니다. 명령어를 직접 선택해 주세요.';
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const data = values();
      if (data.mode === 'reserve' && !confirm('실제 좌석 예약을 시작합니다. 결제는 자동으로 진행되지 않습니다. 계속할까요?')) return;
      runButton.disabled = true;
      status.className = '';
      status.textContent = '감시 프로그램을 시작하는 중입니다…';
      try {
        const response = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '실행하지 못했습니다.');
        watcherStarted = true;
        preview.textContent = result.command;
        status.className = 'success';
        status.textContent = '시작했습니다. 진행 상황은 터미널에서 확인하세요. 이 페이지는 닫아도 됩니다.';
      } catch (error) {
        runButton.disabled = false;
        status.className = 'error';
        status.textContent = error.message;
      }
    });

    window.addEventListener('pagehide', () => {
      if (!watcherStarted) navigator.sendBeacon('/api/close');
    });
  </script>
</body>
</html>
